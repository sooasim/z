components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Money:
      type: object
      required:
      - currency
      - amount
      properties:
        currency:
          type: string
          minLength: 3
          maxLength: 3
        amount:
          type: integer
          description: Minor currency unit
    Problem:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        correlationId:
          type: string
