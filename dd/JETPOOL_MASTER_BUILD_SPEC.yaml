meta:
  name: JETPOOL Commercial Platform
  version: '2.0'
  generated: '2026-10-08'
  source: Uploaded v1 technical whitepaper
  production_rule: AI may generate and deploy to staging automatically; production requires explicit environment approval.
architecture:
  source_of_truth: PostgreSQL
  non_authoritative:
  - Meilisearch
  - Redis
  - Realtime delivery
  - AI recommendations
  repos:
    jetpool-web: Customer Web/PWA; public marketplace; traveler/host/guide self-service UI
    jetpool-api: BFF/common APIs; identity; profile; listing; travel commerce; orchestration
    jetpool-booking: Availability, quote, hold, reservation, cancellation and inventory concurrency
    jetpool-exchange: Home Exchange request, counter, verification, agreement and calendar locking
    jetpool-guide: Guide Friend profile, availability, matching, offers and bookings
    jetpool-admin: Admin/backoffice, compliance, disputes, accounting, CMS integration
    jetpool-contracts: OpenAPI, AsyncAPI, JSON Schema, enums, generated clients/types
    jetpool-infra: Terraform, CI/CD, environment bootstrap, observability, runbooks, one-click orchestrator
  cross_domain_invariants:
  - Paid Stay, Home Exchange and Guide Friend retain independent state machines.
  - Search results never finalize availability; checkout must revalidate authoritative inventory.
  - Client-side payment success never confirms a reservation/order.
  - All external callbacks are idempotent and replay-safe.
  - Double-entry ledger entries are immutable; corrections are compensating entries.
  - Paid accommodation publication is blocked by jurisdiction/compliance predicates.
  - Admin access to private messages requires a case reason and audited elevation.
  - Tax rates and legal classifications are configurable policy, not universal hard-coded constants.
environments:
- dev
- staging
- prod
modules:
