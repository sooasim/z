  priority: P1
  repo: jetpool-admin
  responsibility: Settlement periods, payee statement, approval, payout execution/reconciliation and holds.
  owned_or_primary_tables:
  - settlements
  - payouts
  - payout_accounts
  api_or_interfaces:
  - /v1/provider/settlements
  - /v1/admin/settlements/{id}/approve
  events:
  - settlement.ready
  - payout.sent
  - payout.reconciled
  depends_on:
  - FIN-01
  - TRUST-01
  ui_routes:
  - /earnings
  - /admin/settlements
  acceptance: Settlement net derives from ledger; payout account changes require AAL2 and audit.
- id: FIN-03
  name: Fee / Tax / Evidence Rule Engine
  priority: P1
  repo: jetpool-admin
  responsibility: Configurable fee and tax evidence rules by merchant/supplier type; no unverified hard-coded universal tax
    rate.
  owned_or_primary_tables:
  - fee_rules
  - tax_rules
  - receipt_records
  api_or_interfaces:
  - /v1/finance/rules
  - /v1/receipts
  events:
  - finance.rule.changed
  depends_on:
  - CORE-03
  ui_routes:
  - /admin/finance/rules
  acceptance: Rules are effective-dated/versioned and changes do not retroactively mutate historical transactions.
- id: COMMS-01
  name: P2P Messaging
  priority: P0
  repo: jetpool-api
  responsibility: Context-bound conversation, message persistence, realtime delivery, attachments, read state and abuse controls.
  owned_or_primary_tables:
  - conversations
  - conversation_members
  - messages
  api_or_interfaces:
  - /v1/conversations
  - /v1/conversations/{id}/messages
  events:
  - message.created
  - message.reported
  depends_on:
  - CORE-01
  ui_routes:
  - /messages
  acceptance: RLS/API policy prevents non-members from reading/subscribing; admin access requires case-based audited elevation.
- id: COMMS-02
  name: Notification Orchestration
  priority: P0
  repo: jetpool-api
  responsibility: Email/SMS/push/in-app preferences, templates, retries and event-driven delivery.
  owned_or_primary_tables:
  - notifications
  - notification_preferences
  - notification_deliveries
  api_or_interfaces:
  - /v1/notifications
  - /v1/notification-preferences
  events:
  - notification.requested
  - notification.delivered
  depends_on:
  - PLAT-03
  ui_routes:
  - /notifications
  - /account/notifications
  acceptance: Critical booking/payment notices ignore marketing opt-out but honor mandatory-channel policy and delivery audit.
- id: OPS-01
  name: Customer Support / Case Desk
  priority: P0
  repo: jetpool-admin
  responsibility: Chatwoot-backed support intake linked to user/booking/exchange/dispute context.
  owned_or_primary_tables:
  - support_case_links
  api_or_interfaces:
  - /v1/support/cases
  events:
  - support.case.opened
  depends_on:
  - TRUST-03
  - COMMS-01
  ui_routes:
  - /support
  - /admin/support
  acceptance: Support agent access is scoped and sensitive data is masked unless elevation is granted.
- id: OPS-02
  name: Admin / Backoffice
  priority: P0
  repo: jetpool-admin
  responsibility: Operational console for users, listings, compliance, reservations, exchanges, guides, payments, refunds
    and settlements.
  owned_or_primary_tables:
  - admin_saved_views
  api_or_interfaces:
  - /v1/admin/*
  events:
  - admin.action.performed
  depends_on:
  - CORE-03
  ui_routes:
  - /admin/*
  acceptance: Every money/permission/compliance mutation is AAL2-gated and append-only audited.
- id: OPS-03
  name: CMS, Content & SEO
  priority: P0
  repo: jetpool-admin
  responsibility: Destination/story/FAQ/promotion/legacy WONT content, redirects, metadata and structured content.
  owned_or_primary_tables:
  - cms_external_refs
  - seo_redirects
  api_or_interfaces:
  - Payload API
  - /v1/seo/redirects
  events:
  - content.published
  depends_on: []
  ui_routes:
  - /discover
  - /stories
  - /admin/cms
  acceptance: Legacy high-value URLs have 301 mappings and content publication is separated from transaction truth.
- id: OPS-04
  name: Analytics & Audit
  priority: P0
  repo: jetpool-admin
  responsibility: GMV, conversion, cancellation, search, compliance, disputes, finance dashboards and immutable audit trail.
  owned_or_primary_tables:
  - audit_logs
  - analytics_events
  api_or_interfaces:
  - /v1/admin/analytics/*
  - /v1/admin/audit-logs
  events:
  - audit.recorded
  depends_on:
  - PLAT-03
  ui_routes:
  - /admin/analytics
  - /admin/audit
  acceptance: Operational metrics reconcile against source tables; audit logs exclude secrets while retaining actor/resource/effect.
- id: PLAT-01
  name: Search Projection Service
  priority: P0
  repo: jetpool-api
  responsibility: Project PostgreSQL entities into Meilisearch; reindex, version, lag monitoring and recovery.
  owned_or_primary_tables:
  - search_projection_offsets
  api_or_interfaces:
  - internal /search-sync
  events:
  - search.projection.updated
  depends_on:
  - PLAT-03
  ui_routes:
  - internal
  acceptance: Index can be rebuilt from PostgreSQL and never acts as final authority for sellable availability.
- id: PLAT-02
  name: Map / Geo Adapter
  priority: P0
  repo: jetpool-api
  responsibility: MapLibre rendering support, geocoding abstraction, viewport search and provider cost controls.
  owned_or_primary_tables:
  - geo_cache
  api_or_interfaces:
  - /v1/geo/geocode
  - /v1/geo/reverse
  events:
  - geo.cache.updated
  depends_on: []
  ui_routes:
  - map components
  acceptance: Provider is replaceable behind adapter; address precision exposure follows privacy policy.
- id: PLAT-03
  name: Transactional Outbox & Async Jobs
  priority: P0
  repo: jetpool-api
  responsibility: Outbox in same transaction, durable queue, retries, dead-letter handling, event correlation and schema version.
  owned_or_primary_tables:
  - outbox_events
  - job_runs
  - dead_letters
  api_or_interfaces:
  - internal
  events:
  - '* domain events'
  depends_on: []
  ui_routes:
  - internal
  acceptance: No domain mutation emits only an in-memory event; retries are idempotent and observable.
- id: PLAT-04
  name: Observability / SRE
  priority: P0
  repo: jetpool-infra
  responsibility: OpenTelemetry traces, metrics, logs, synthetic checks, SLOs, alerting and incident runbooks.
  owned_or_primary_tables:
  - none
  api_or_interfaces:
  - /health
  - /ready
  - /metrics
  events:
  - incident.opened
  depends_on: []
  ui_routes:
  - /admin/ops
  acceptance: Dashboards cover p95 latency, error rate, queue lag, payment reconciliation lag and booking collision errors.
- id: PLAT-05
  name: Security / Risk Controls
  priority: P0
  repo: jetpool-infra
  responsibility: WAF/rate-limit, bot protection, secret management, SAST/SCA/SBOM, DAST, upload scanning and risk flags.
  owned_or_primary_tables:
  - risk_events
  - security_incidents
  api_or_interfaces:
  - internal risk API
  events:
  - risk.detected
  - security.incident
  depends_on:
  - CORE-01
  ui_routes:
  - /admin/security
  acceptance: Release blocks on critical vulnerabilities, leaked secrets, failed permission-negative tests or missing SBOM.
- id: PLAT-06
  name: Configuration & Feature Flags
  priority: P0
  repo: jetpool-api
  responsibility: Environment-safe feature flags, business rules, percentage rollout and kill switches.
  owned_or_primary_tables:
  - feature_flags
  - config_versions
  api_or_interfaces:
  - /v1/admin/feature-flags
  events:
  - config.changed
  depends_on:
  - CORE-03
  ui_routes:
  - /admin/config
  acceptance: Critical features such as paid charter flow can remain OFF independently of deployment.
- id: MIG-01
  name: Legacy WONT/Sixshop Migration
  priority: P0
  repo: jetpool-infra
  responsibility: Inventory existing URLs/content/member/order assets, official export, ID mapping, media import, consent
    audit, 301s and cutover reconciliation.
  owned_or_primary_tables:
  - migration_id_map
  - migration_audit
  - seo_redirects
  api_or_interfaces:
  - migration CLI
  events:
  - migration.batch.completed
  depends_on:
  - OPS-03
  - CORE-01
  ui_routes:
  - internal migration dashboard
  acceptance: Dry-run reconciliation proves row counts, amounts, media references and URL mappings before cutover.
- id: AI-01
  name: AI Travel Assistant
  priority: P1
  repo: jetpool-api
  responsibility: Intent parsing, trip planning, explainable suggestions using live search/availability; never autonomously
    commits paid transactions.
  owned_or_primary_tables:
  - ai_sessions
  - ai_recommendations
  api_or_interfaces:
  - /v1/ai/travel-assistant
  events:
  - ai.recommendation.created
  depends_on:
  - STAY-04
  - GUIDE-03
  - TRAVEL-01
  ui_routes:
  - /assistant
  acceptance: AI suggestions cite live availability snapshot and require explicit user confirmation before hold/payment.
- id: AI-02
  name: Recommendation & Personalization
  priority: P1
  repo: jetpool-api
  responsibility: Behavioral/explicit preference ranking with cold-start rules, opt-out and non-authoritative recommendations.
  owned_or_primary_tables:
  - recommendation_features
  - recommendation_impressions
  api_or_interfaces:
  - /v1/recommendations
  events:
  - recommendation.impression
  depends_on:
  - CORE-02
  - OPS-04
  ui_routes:
  - home/discovery rails
  acceptance: Opt-out removes behavioral personalization; ranking never bypasses legal/compliance/availability filters.
- id: INT-01
  name: PMS / Supplier Integrations
  priority: P2
  repo: jetpool-api
  responsibility: External PMS/channel/supplier adapter framework, polling/webhooks, mapping and conflict handling.
  owned_or_primary_tables:
  - integration_accounts
  - integration_mappings
  - integration_events
  api_or_interfaces:
  - /v1/integrations/*
  events:
  - integration.sync.completed
  depends_on:
  - STAY-06
  - PLAT-03
  ui_routes:
  - /host/integrations
  acceptance: External state is reconciled into Jetpool authority rules with clear conflict policy and audit.
release_gates:
- id: G0
  name: Spec integrity
  criteria:
  - All P0 modules have owner, API, data, event, UI and acceptance criteria
  - No unresolved contract references
- id: G1
  name: Contracts
  criteria:
  - OpenAPI/AsyncAPI lint pass
  - Generated client/types compile
  - Breaking changes explicitly versioned
- id: G2
  name: Data
  criteria:
  - Migrations up/down or forward-fix tested
  - Constraints/invariants enabled
  - Seed data deterministic
- id: G3
  name: Domain
  criteria:
  - Unit/property/integration tests pass
  - State transition negative tests pass
  - Idempotency tests pass
- id: G4
  name: End-to-end
  criteria:
  - Stay paid flow passes
  - Exchange bilateral flow passes
  - Guide free/paid flow passes
  - Travel order flow passes where enabled
- id: G5
  name: Security
  criteria:
  - SAST/SCA/secret scan pass
  - Permission-negative tests pass
  - AAL2 gates pass
  - No PAN/CVC storage
- id: G6
  name: Performance
  criteria:
  - Search/read/write SLO targets meet load-test plan
  - No oversell under concurrency test
- id: G7
  name: Migration
  criteria:
  - Dry-run reconciliation approved
  - 301 URL map approved
  - Consent/password migration strategy approved
- id: G8
  name: DR & Ops
  criteria:
  - Restore drill successful
  - Runbooks and alert routes tested
  - Payment reconciliation tested
- id: G9
  name: Legal/Business approval
  criteria:
  - Accommodation/guide/travel/charter gates signed off
  - Merchant-of-record and settlement policy approved
  - Terms/privacy/refund policies published
- id: G10
  name: Production approval
  criteria:
  - Immutable release artifact
  - GitHub Environment manual approval
  - Canary + smoke + rollback readiness
