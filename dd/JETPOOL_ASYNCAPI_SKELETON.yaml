components:
  messages:
    DomainEvent:
      payload:
        type: object
        required:
        - eventId
        - eventType
        - version
        - occurredAt
        - aggregateId
        - correlationId
        properties:
          eventId:
            type: string
            format: uuid
          eventType:
            type: string
          version:
            type: integer
          occurredAt:
            type: string
            format: date-time
          aggregateId:
            type: string
          correlationId:
            type: string
          causationId:
            type: string
          data:
            type: object
            additionalProperties: true
