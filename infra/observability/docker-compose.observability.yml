# Local observability overlay:
#   docker compose -f docker-compose.yml -f infra/observability/docker-compose.observability.yml up -d
# Grafana http://localhost:3001 (admin/admin, local only) · Prometheus http://localhost:9090
services:
  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0
    environment:
      DATA_SOURCE_NAME: postgresql://postgres:postgres@postgres:5432/jetpool?sslmode=disable
    command: ["--extend.query-path=/etc/pg-exporter/queries.yaml"]
    volumes: ["./infra/observability/postgres-exporter/queries.yaml:/etc/pg-exporter/queries.yaml:ro"]
    depends_on: [postgres]
  prometheus:
    image: prom/prometheus:v2.54.1
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--enable-feature=expand-external-labels"]
    environment: { JETPOOL_ENV: local }
    volumes:
      - ./infra/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/observability/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports: ["9090:9090"]
  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3001:3000"]
    depends_on: [prometheus]
