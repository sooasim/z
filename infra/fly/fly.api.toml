# Fly.io alternative target (DEPLOY_TARGET=fly). App name is passed with -a jetpool-<env>-api.
primary_region = "nrt"   # closest Fly region to Seoul; switch to "icn" when available on your org

[build]
  # images are pre-built in CI and deployed with --image <digest>

[deploy]
  release_command = "migrate"   # forward-only migrations, once per release, before machines roll
  strategy = "rolling"

[processes]
  app = "api"

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = "off"
  min_machines_running = 2
  processes = ["app"]
  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

[[http_service.checks]]
  interval = "15s"
  timeout = "5s"
  grace_period = "20s"
  method = "GET"
  path = "/ready"

[[vm]]
  size = "shared-cpu-2x"
  memory = "1gb"
