apiVersion: apps/v1
kind: Deployment
metadata:
  name: jetpool-api
  labels: { app.kubernetes.io/name: jetpool-api, track: stable }
spec:
  replicas: 2
  revisionHistoryLimit: 10
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels: { app.kubernetes.io/name: jetpool-api, track: stable }
  template:
    metadata:
      labels: { app.kubernetes.io/name: jetpool-api, track: stable, jetpool/role: api }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "4000"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: jetpool
      securityContext: { runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000, seccompProfile: { type: RuntimeDefault } }
      terminationGracePeriodSeconds: 40
      containers:
        - name: api
          image: ghcr.io/jetpool/jetpool-api:latest
          args: ["api"]
          ports: [{ name: http, containerPort: 4000 }]
          envFrom:
            - configMapRef: { name: jetpool-config }
            - secretRef: { name: jetpool-app }
          readinessProbe:
            httpGet: { path: /ready, port: http }
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            requests: { cpu: 250m, memory: 384Mi }
            limits: { memory: 1Gi }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes: [{ name: tmp, emptyDir: {} }]
---
apiVersion: v1
kind: Service
metadata:
  name: jetpool-api
  labels: { app.kubernetes.io/name: jetpool-api }
spec:
  # selects stable AND canary pods (no `track` selector) -> canary gets traffic proportional to its replicas
  selector: { app.kubernetes.io/name: jetpool-api }
  ports: [{ name: http, port: 80, targetPort: http }]
