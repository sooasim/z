apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: jetpool-api
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: jetpool-api }
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 60 } }
  behavior:
    scaleDown: { stabilizationWindowSeconds: 300 }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: jetpool-web
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: jetpool-web }
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 60 } }
