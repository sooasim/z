apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: jetpool-api
spec:
  minAvailable: 1
  selector:
    matchLabels: { app.kubernetes.io/name: jetpool-api, track: stable }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: jetpool-web
spec:
  minAvailable: 1
  selector:
    matchLabels: { app.kubernetes.io/name: jetpool-web }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: jetpool-worker
spec:
  maxUnavailable: 1
  selector:
    matchLabels: { app.kubernetes.io/name: jetpool-worker }
