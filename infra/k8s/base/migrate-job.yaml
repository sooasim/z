# One-shot forward-only migration (packages/db/migrate.mjs). Applied by `infra/scripts/deploy.sh <env> migrate`,
# which substitutes IMAGE_PLACEHOLDER with the release digest. Not part of kustomization resources.
apiVersion: batch/v1
kind: Job
metadata:
  name: jetpool-migrate
  labels: { app.kubernetes.io/name: jetpool-migrate, app.kubernetes.io/part-of: jetpool }
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 900
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels: { app.kubernetes.io/name: jetpool-migrate }
    spec:
      restartPolicy: Never
      serviceAccountName: jetpool
      securityContext: { runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: migrate
          image: IMAGE_PLACEHOLDER
          args: ["migrate"]
          envFrom:
            - configMapRef: { name: jetpool-config }
            - secretRef: { name: jetpool-app }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes: [{ name: tmp, emptyDir: {} }]
