# Static GitHub Pages demo of the real apps/web UI (no server). See docs/DEMO.md.
# The recorded API fixtures (packages/demo/fixtures/api.json) are committed, so this job needs no PostgreSQL.
# Publishing model: the built site is pushed to the `gh-pages` branch (GitHub Pages "Deploy from a branch",
# which GitHub enables automatically for public repositories when that branch exists).
# Site URL: https://<owner>.github.io/<repo>/ (basePath = /<repo>).
name: pages

on:
  push:
    branches: [claude/eager-ride-bjce41]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'infra/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  build-deploy:
    name: Build static demo and publish to gh-pages
    # deploy only verified states: manual dispatch or a commit message containing [deploy]
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[deploy]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build (next export + demo runtime)
        run: node scripts/pages/build.mjs
        env:
          NEXT_BASE_PATH: /${{ github.event.repository.name }}
          PAGES_ORIGIN: https://${{ github.repository_owner }}.github.io
      - name: Sanity check
        run: |
          test -f dist-pages/index.html
          test -f dist-pages/404.html
          test -f dist-pages/demo-backend.js
          test -f dist-pages/demo-fixtures.json
          grep -q 'demo-backend.js' dist-pages/index.html
          touch dist-pages/.nojekyll
      - name: Publish to gh-pages branch
        working-directory: dist-pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Deploy static demo from ${GITHUB_SHA}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
      - name: Summary
        run: echo "Published https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/" >> "$GITHUB_STEP_SUMMARY"

  live-check:
    name: Verify the published site is live
    needs: build-deploy
    runs-on: ubuntu-latest
    steps:
      - name: Wait for GitHub Pages and check key URLs
        run: |
          BASE="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
          for i in $(seq 1 40); do
            code=$(curl -s -o page.html -w '%{http_code}' "$BASE/")
            if [ "$code" = "200" ] && grep -q 'JETPOOL' page.html; then break; fi
            echo "attempt $i: HTTP $code"; sleep 15
          done
          for path in "" "stay/" "exchange/" "guide-friends/" "travel/" "login/" "about/" "archive/" "credits/" "media-map.json" "demo-backend.js" "demo-fixtures.json"; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$BASE/$path")
            echo "$code $BASE/$path"
            test "$code" = "200"
          done
          echo "Live: $BASE/" >> "$GITHUB_STEP_SUMMARY"
