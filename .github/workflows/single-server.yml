# Verify and deploy the single-server install from GitHub's runners.
#
# Why this exists: the operator's box sits behind a cloud security group and the only machine that can
# both reach it and be driven from a pull request is a GitHub runner. Runners have unrestricted outbound,
# so `verify` can see the server the way the public internet does — which is exactly what you cannot tell
# from inside the server, and what `jetpool.sh doctor` can only infer.
#
#   verify  — no credentials at all. Resolves the four names, says whether each is a routable public
#             address and whether they agree, then probes 80/443 and HTTPS. Run this first.
#   deploy  — opt in with the `deploy` input. Needs the secrets below, and runs
#             infra/single-server/install.sh over SSH.
#
# Two ways in, because they are different jobs:
#
#   workflow_dispatch + deploy=true   FIRST setup of a server: runs install.sh, which writes .env, the
#                                     Caddy mode and the public addresses from the inputs you give it.
#   push of `deploy-*` (tag or branch) RE-deploy of a server that is already set up: ships the current
#                                     default branch with `jetpool.sh deploy` (build → migrate → up →
#                                     smoke) and never touches .env or the domain mode. No inputs, so
#                                     nothing can accidentally rewrite a live site into IP mode — and a
#                                     tag push needs no `actions: write`, so anyone (or any agent) who
#                                     can push can ship:
#
#                                       git push origin HEAD:refs/heads/deploy-$(date -u +%Y%m%d-%H%M)
#
# Secrets for `deploy` (Settings → Secrets and variables → Actions):
#   JETPOOL_SSH_HOST       the server's public IP or hostname
#   JETPOOL_SSH_USER       login user; `root`, or a user with passwordless sudo
#   JETPOOL_SSH_KEY        a PRIVATE SSH key whose public half is in that user's authorized_keys
#   JETPOOL_SSH_PASSWORD   instead of the key, when you cannot get a shell on the server to mint one.
#                          A key is minted ON the server, so requiring one means the first deploy needs
#                          the very shell access this job exists to replace. The password breaks that
#                          circle — and costs what a password costs: it works everywhere that password
#                          works, and it cannot be revoked by deleting a line. Use it to get the first
#                          deploy through, then run `jetpool.sh deploy-key`, store the four values it
#                          prints, and DELETE this secret.
#   JETPOOL_SSH_HOST_KEY   optional, recommended: the server's host key line, from
#                          `ssh-keyscan <host>` run somewhere you trust. Pins the host so this job
#                          cannot be pointed at an impostor. Without it the job trusts whatever
#                          answers on the first connection and says so.
#   JETPOOL_SSH_PORT       optional, defaults to 22
#
# Use a key, not the login password: a password in a secret is replayable everywhere that password works,
# while a key generated for this job alone can be revoked by deleting one line from authorized_keys.
name: single-server

on:
  workflow_dispatch:
    inputs:
      domain:
        description: "Domain to serve (blank = verify the IP only)"
        required: false
        default: ""
      email:
        description: "Let's Encrypt contact e-mail (required to deploy with a domain)"
        required: false
        default: ""
      deploy:
        description: "Actually deploy over SSH (needs the JETPOOL_SSH_* secrets)"
        type: boolean
        default: false
      seed:
        description: "Load the demo catalogue after deploying"
        type: boolean
        default: true
      skip_dns_check:
        description: "Deploy even if the installer's DNS preflight objects"
        type: boolean
        default: false
  push:
    # A re-deploy button that needs no API permission: push the ref, the runner ships the branch.
    # Tag or branch, because some git proxies refuse to forward a tag push but pass branches fine.
    tags: ['deploy-*']
    branches: ['deploy-*']

permissions:
  contents: read

concurrency:
  group: single-server
  cancel-in-progress: false

jobs:
  verify:
    name: verify from the public internet
    runs-on: ubuntu-latest
    steps:
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq dnsutils
      - name: Resolve and probe
        env:
          DOMAIN: ${{ inputs.domain }}
          HOST_IP: ${{ secrets.JETPOOL_SSH_HOST }}
        run: |
          set -uo pipefail
          is_private() {
            case "$1" in
              10.*|127.*|169.254.*|192.168.*|172.1[6-9].*|172.2[0-9].*|172.3[01].*) return 0 ;;
              100.6[4-9].*|100.[7-9][0-9].*|100.1[0-1][0-9].*|100.12[0-7].*) return 0 ;;
            esac
            return 1
          }
          fail=0
          addrs=""

          if [ -n "${DOMAIN:-}" ]; then
            echo "## DNS"
            for n in "$DOMAIN" "www.$DOMAIN" "api.$DOMAIN" "s3.$DOMAIN"; do
              a="$(dig +short +time=5 +tries=2 "$n" A | grep -E '^[0-9.]+$' | paste -sd, -)"
              if [ -z "$a" ]; then
                echo "  FAIL $n does not resolve"
                fail=1
              elif is_private "${a%%,*}"; then
                echo "  FAIL $n -> $a is a private address; the internet cannot route it"
                fail=1
              else
                echo "  ok   $n -> $a"
                addrs="$addrs ${a%%,*}"
              fi
            done
            uniq_count="$(printf '%s\n' $addrs | sort -u | wc -l)"
            [ "$uniq_count" -le 1 ] || echo "  note the four names do not all point at one address: $(printf '%s\n' $addrs | sort -u | paste -sd' ' -)"
          else
            echo "## DNS — skipped (no domain given)"
          fi

          target="${DOMAIN:-}"
          [ -n "$target" ] || target="${HOST_IP:-}"
          if [ -z "$target" ]; then
            echo "## Reachability — nothing to probe (give a domain, or set JETPOOL_SSH_HOST)"
          else
            echo "## Reachability of $target"
            # Informational only: before the first deploy nothing listens yet, and failing here would
            # stop the deploy job that is supposed to fix it. Only DNS gates the deploy.
            for port in 80 443; do
              if timeout 12 bash -c "cat < /dev/null > /dev/tcp/$target/$port" 2>/dev/null; then
                echo "  ok   tcp/$port accepted a connection"
              else
                echo "  note tcp/$port refused or timed out — expected if nothing is deployed yet;"
                echo "       after a deploy it means the security group still blocks inbound $port."
                echo "       80 closed: http://<domain> is dead, so a visitor typing the bare domain sees"
                echo "       nothing, though a certificate can still be issued over 443 (TLS-ALPN-01)."
                echo "       443 closed: the site cannot serve at all." 
              fi
            done
            echo "## HTTP"
            code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "http://$target/" 2>&1 || true)"
            echo "  http://$target/  -> $code"
            if [ -n "${DOMAIN:-}" ]; then
              out="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 25 "https://$DOMAIN/" 2>&1 || true)"
              echo "  https://$DOMAIN/ -> $out"
              case "$out" in
                200|30[0-9]) echo "  ok   HTTPS is serving, so the certificate is valid and 443 is open" ;;
                *) echo "  note HTTPS did not return a success/redirect; if the deploy just ran, Caddy may still be issuing" ;;
              esac
            fi
          fi

          echo
          if [ "$fail" -eq 0 ] && [ -z "${DOMAIN:-}" ]; then
            echo "Verdict: no domain was given, so nothing about DNS was checked."
          elif [ "$fail" -eq 0 ]; then
            echo "Verdict: DNS is sound. Any 'note' above about ports is only a problem after a deploy."
          else
            echo "Verdict: the DNS above cannot work — see the FAIL lines. The records must hold this"
            echo "server's PUBLIC address, or Let's Encrypt can never validate and the deploy is pointless."
            echo "Not deploying on top of that; fix DNS and run this again."
          fi
          exit "$fail"

  deploy:
    name: deploy over SSH
    needs: verify
    if: ${{ inputs.deploy || (startsWith(github.ref, 'refs/tags/deploy-') || startsWith(github.ref, 'refs/heads/deploy-')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Check the secrets are present
        env:
          HOST: ${{ secrets.JETPOOL_SSH_HOST }}
          USER_NAME: ${{ secrets.JETPOOL_SSH_USER }}
          KEY: ${{ secrets.JETPOOL_SSH_KEY }}
          HOST_KEY: ${{ secrets.JETPOOL_SSH_HOST_KEY }}
          PASSWORD: ${{ secrets.JETPOOL_SSH_PASSWORD }}
          DOMAIN: ${{ inputs.domain }}
          EMAIL: ${{ inputs.email }}
        run: |
          missing=""
          [ -n "$HOST" ] || missing="$missing JETPOOL_SSH_HOST"
          [ -n "$USER_NAME" ] || missing="$missing JETPOOL_SSH_USER"
          # A key is the better credential, but it has to be minted ON the server, and someone who cannot
          # get a shell there cannot mint one. The password is accepted so the first deploy needs nothing
          # but this repository's settings page.
          [ -n "$KEY" ] || [ -n "$PASSWORD" ] || missing="$missing JETPOOL_SSH_KEY(or JETPOOL_SSH_PASSWORD)"
          if [ -n "$missing" ]; then
            echo "::error::missing repository secrets:$missing — see the comments at the top of this workflow"
            exit 1
          fi
          if [ -z "$KEY" ]; then
            echo "::warning::signing in with JETPOOL_SSH_PASSWORD. A password works everywhere that password works, so run 'jetpool.sh deploy-key' once this deploy succeeds, put the four values it prints in the secrets, and delete JETPOOL_SSH_PASSWORD."
          fi
          [ -n "$HOST_KEY" ] || echo "::warning::JETPOOL_SSH_HOST_KEY is not set, so this job trusts whatever host answers first"
          if [ -n "$DOMAIN" ] && [ -z "$EMAIL" ]; then
            echo "::error::deploying with a domain needs an e-mail for Let's Encrypt expiry notices"
            exit 1
          fi

      - name: Prepare SSH
        env:
          HOST: ${{ secrets.JETPOOL_SSH_HOST }}
          PORT: ${{ secrets.JETPOOL_SSH_PORT }}
          KEY: ${{ secrets.JETPOOL_SSH_KEY }}
          HOST_KEY: ${{ secrets.JETPOOL_SSH_HOST_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          if [ -n "$KEY" ]; then
            printf '%s\n' "$KEY" > ~/.ssh/id_deploy
            chmod 600 ~/.ssh/id_deploy
          else
            sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
          fi
          if [ -n "$HOST_KEY" ]; then
            printf '%s\n' "$HOST_KEY" > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "${PORT:-22}" -H "$HOST" > ~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 600 ~/.ssh/known_hosts

          # One wrapper for both credentials, so the steps below never branch on which one is in use.
          # The password path cannot use BatchMode (it disables password auth) and reads the password
          # from $SSHPASS, never from a command line that `ps` on the runner could show.
          cat > ~/.ssh/jpssh <<'WRAP'
          #!/usr/bin/env bash
          set -euo pipefail
          if [ -f "$HOME/.ssh/id_deploy" ]; then
            exec ssh -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=20 \
                 -i "$HOME/.ssh/id_deploy" -p "${JP_PORT:-22}" "$@"
          fi
          exec sshpass -e ssh -o PubkeyAuthentication=no -o PreferredAuthentications=password \
               -o ConnectTimeout=20 -p "${JP_PORT:-22}" "$@"
          WRAP
          chmod 700 ~/.ssh/jpssh

      - name: Run the installer on the server
        env:
          HOST: ${{ secrets.JETPOOL_SSH_HOST }}
          USER_NAME: ${{ secrets.JETPOOL_SSH_USER }}
          PORT: ${{ secrets.JETPOOL_SSH_PORT }}
          DOMAIN: ${{ inputs.domain }}
          EMAIL: ${{ inputs.email }}
          SEED: ${{ inputs.seed }}
          SKIP_DNS: ${{ inputs.skip_dns_check }}
          # A tag push re-deploys what is already configured; a dispatch sets a server up from scratch.
          SSHPASS: ${{ secrets.JETPOOL_SSH_PASSWORD }}
          JP_PORT: ${{ secrets.JETPOOL_SSH_PORT }}
          MODE: ${{ (startsWith(github.ref, 'refs/tags/deploy-') || startsWith(github.ref, 'refs/heads/deploy-')) && 'update' || 'install' }}
          # On a tag push `github.ref_name` is the tag, which is no branch to check out on the server, so
          # the update path ships the default branch — the tag is a button, not the payload.
          BRANCH: ${{ (startsWith(github.ref, 'refs/tags/deploy-') || startsWith(github.ref, 'refs/heads/deploy-')) && github.event.repository.default_branch || github.ref_name }}
          REPO: ${{ github.server_url }}/${{ github.repository }}.git
        run: |
          set -euo pipefail
          # The remote script is fed on stdin so nothing needs quoting through the shell twice.
          ~/.ssh/jpssh "$USER_NAME@$HOST" \
              env DOMAIN="$DOMAIN" EMAIL="$EMAIL" SEED="$SEED" SKIP_DNS="$SKIP_DNS" MODE="$MODE" \
                  BRANCH="$BRANCH" REPO="$REPO" bash -s <<'REMOTE'
          set -euo pipefail
          SUDO=""
          [ "$(id -u)" -eq 0 ] || SUDO="sudo -n"
          $SUDO true || { echo "this user needs passwordless sudo, or log in as root" >&2; exit 1; }

          command -v git >/dev/null 2>&1 || { $SUDO apt-get update -qq && $SUDO apt-get install -y -qq git; }
          DIR="$HOME/jetpool"
          if [ -d "$DIR/.git" ]; then
            git -C "$DIR" fetch --depth 1 origin "$BRANCH"
            git -C "$DIR" checkout -B "$BRANCH" "origin/$BRANCH"
          else
            if [ "$MODE" = "update" ]; then
              echo "no checkout at $DIR, so this server was never set up — run the workflow by hand once" >&2
              echo "(Actions -> single-server -> Run workflow, with a domain and an e-mail) before tagging." >&2
              exit 1
            fi
            git clone --branch "$BRANCH" --single-branch "$REPO" "$DIR"
          fi

          if [ "$MODE" = "update" ]; then
            # Already configured: ship the code and leave the configuration alone. .env, the Caddy mode and
            # the public addresses stay exactly as they are, so a re-deploy can never demote a live HTTPS
            # site into IP mode — which is what install.sh would do here with no domain input to go on.
            [ -f "$DIR/infra/single-server/.env" ] || { echo "$DIR/infra/single-server/.env is missing: nothing to re-deploy" >&2; exit 1; }
            echo "re-deploying $BRANCH with the configuration already on this server"
            $SUDO bash "$DIR/infra/single-server/jetpool.sh" deploy
            exit 0
          fi

          args=""
          if [ -n "$DOMAIN" ]; then args="--domain $DOMAIN --email $EMAIL"; else
            echo "no domain given; deploying in IP mode against this host's public address"
            ip="$(curl -fsS --max-time 8 https://api.ipify.org || true)"
            [ -n "$ip" ] || { echo "could not determine this server's public IP" >&2; exit 1; }
            args="--ip $ip"
          fi
          [ "$SEED" = "true" ] && args="$args --seed"
          [ "$SKIP_DNS" = "true" ] && args="$args --skip-dns-check"

          echo "running: install.sh $args"
          $SUDO bash "$DIR/infra/single-server/install.sh" $args
          REMOTE

      - name: Report what the server thinks
        if: always()
        env:
          HOST: ${{ secrets.JETPOOL_SSH_HOST }}
          USER_NAME: ${{ secrets.JETPOOL_SSH_USER }}
          SSHPASS: ${{ secrets.JETPOOL_SSH_PASSWORD }}
          JP_PORT: ${{ secrets.JETPOOL_SSH_PORT }}
        run: |
          ~/.ssh/jpssh "$USER_NAME@$HOST" \
              'cd ~/jetpool && ./infra/single-server/jetpool.sh doctor' || true

      # The server cannot answer "does this open from the internet?" about itself: a request it makes to
      # its own public address can turn around inside the cloud's NAT and never leave. The runner is a
      # stranger on the public internet, which is exactly the vantage point the question is about.
      - name: Check every public address from outside
        if: always()
        env:
          HOST: ${{ secrets.JETPOOL_SSH_HOST }}
          USER_NAME: ${{ secrets.JETPOOL_SSH_USER }}
          SSHPASS: ${{ secrets.JETPOOL_SSH_PASSWORD }}
          JP_PORT: ${{ secrets.JETPOOL_SSH_PORT }}
        run: |
          set -uo pipefail
          # Ask the server which names it is configured to serve, rather than hard-coding them here.
          names="$(~/.ssh/jpssh "$USER_NAME@$HOST" bash -s <<'REMOTE' || true
          set -euo pipefail
          env_file="$HOME/jetpool/infra/single-server/.env"
          root="$(awk -F= '$1=="ROOT_DOMAIN"{sub(/^[^=]*=/,""); print; exit}' "$env_file")"
          alts="$(awk -F= '$1=="ALT_DOMAINS"{sub(/^[^=]*=/,""); print; exit}' "$env_file" | tr ',' ' ')"
          mode="$(awk -F= '$1=="DEPLOY_MODE"{sub(/^[^=]*=/,""); print; exit}' "$env_file")"
          [ "$mode" = "domain" ] || exit 0
          echo "$root www.$root api.$root $alts"
          REMOTE
          )"
          names="$(tr -s '[:space:]' ' ' <<< "${names:-}")"
          if [ -z "${names// /}" ]; then
            echo "::warning::could not read the configured domains from the server (IP mode, or .env unreadable)"
            exit 0
          fi
          echo "## From a GitHub runner — i.e. from the public internet"
          echo
          # DNS first. A registrar's own DNS panel is only consulted when the registry's NS records
          # actually point at it, so print the delegation before blaming anything else.
          echo "### DNS as the public internet sees it"
          command -v dig >/dev/null 2>&1 || sudo apt-get install -y -qq dnsutils >/dev/null 2>&1 || true
          server_ip="$(getent hosts "$HOST" | awk '{print $1; exit}' || true)"
          if ! command -v dig >/dev/null 2>&1; then
            echo "  (no dig on this runner — skipping the DNS section)"
          else
            seen_zones=''
            for n in $names; do
              zone="$(awk -F. '{ if (NF>=3 && ($(NF-1)=="co" || $(NF-1)=="or" || $(NF-1)=="ne" || $(NF-1)=="go")) print $(NF-2)"."$(NF-1)"."$NF; else if (NF>=2) print $(NF-1)"."$NF }' <<< "$n")"
              case " $seen_zones " in *" $zone "*) ;; *)
                seen_zones="$seen_zones $zone"
                ns="$(dig +short NS "$zone" @1.1.1.1 2>/dev/null | sort | tr '\n' ' ' || true)"
                printf '  %-28s NS  %s\n' "$zone" "${ns:-(none — the registry publishes no nameservers for this zone)}"
                [ -n "${ns// /}" ] || echo "::warning::$zone has no NS delegation: the nameserver change at the registrar has not taken effect, so whatever DNS records you entered are never consulted"
              ;; esac
            done
            for n in $names; do
              a="$(dig +short A "$n" @1.1.1.1 2>/dev/null | grep -E '^[0-9.]+$' | tr '\n' ' ' || true)"
              printf '  %-28s A   %s\n' "$n" "${a:-(no address)}"
              if [ -z "${a// /}" ]; then
                echo "::warning::$n does not resolve from the public internet — add an A record for it, or wait for the nameserver change"
              elif [ -n "$server_ip" ] && ! grep -qw "$server_ip" <<< "$a"; then
                echo "::warning::$n resolves somewhere other than this server"
              fi
            done
          fi
          echo
          echo "### HTTP as the public internet sees it"
          fail=0
          for n in $names; do
            # The API serves no route at /, where 404 is the correct answer and says nothing about
            # whether the name works. Probe its health endpoint instead, as the smoke test does.
            path='/'
            case "$n" in api.*) path='/health' ;; esac
            https_code="$(curl -sS -o /dev/null --max-time 25 -w '%{http_code}' "https://$n$path" 2>/dev/null || echo 000)"
            loc="$(curl -sSI --max-time 25 "https://$n$path" 2>/dev/null | awk 'tolower($1)=="location:"{print $2}' | tr -d '\r' || true)"
            http_code="$(curl -sS -o /dev/null --max-time 20 -w '%{http_code}' "http://$n$path" 2>/dev/null || echo 000)"
            printf '  %-28s https=%s%s  http=%s\n' "$n$path" "$https_code" "${loc:+ → $loc}" "$http_code"
            case "$https_code" in
              2*|3*) ;;
              *) fail=1 ;;
            esac
          done
          echo
          if [ "$fail" -eq 0 ]; then
            echo "Every name above answers over HTTPS from outside this cloud. If a visitor still cannot"
            echo "reach one, what is left is on their side: a stale DNS cache (a name that used to not"
            echo "exist is remembered as missing for the SOA negative-TTL, often an hour) or their network."
          else
            echo "::warning::a name above did not answer over HTTPS from the public internet. https=000 means"
            echo "the connection never completed: the cloud security group must allow inbound TCP 80 and 443,"
            echo "and a name whose certificate was never issued cannot serve TLS (Caddy needs inbound 80, or"
            echo "443 for TLS-ALPN, reachable at the moment it asks). A 4xx/5xx instead means it answered."
          fi

      - name: Remove the credentials from the runner
        if: always()
        run: rm -f ~/.ssh/id_deploy ~/.ssh/jpssh
