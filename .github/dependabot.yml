version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday, time: "09:00", timezone: Asia/Seoul }
    open-pull-requests-limit: 10
    versioning-strategy: increase
    groups:
      fastify: { patterns: ["fastify", "@fastify/*", "fastify-*"] }
      aws-sdk: { patterns: ["@aws-sdk/*"] }
      next-react: { patterns: ["next", "react", "react-dom", "@types/react*"] }
      dev-tooling: { dependency-type: development, update-types: [minor, patch] }
    labels: [dependencies, security]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday, time: "09:00", timezone: Asia/Seoul }
    groups:
      actions: { patterns: ["*"] }
    labels: [dependencies, ci]
  - package-ecosystem: docker
    directory: /apps/api
    schedule: { interval: weekly, day: monday, time: "09:00", timezone: Asia/Seoul }
    labels: [dependencies, docker]
  - package-ecosystem: docker
    directory: /apps/web
    schedule: { interval: weekly, day: monday, time: "09:00", timezone: Asia/Seoul }
    labels: [dependencies, docker]
  - package-ecosystem: terraform
    directory: /infra/terraform/envs/staging
    schedule: { interval: weekly, day: monday, time: "09:00", timezone: Asia/Seoul }
    labels: [dependencies, infra]
  - package-ecosystem: terraform
    directory: /infra/terraform/envs/prod
    schedule: { interval: weekly, day: monday, time: "09:00", timezone: Asia/Seoul }
    labels: [dependencies, infra]
